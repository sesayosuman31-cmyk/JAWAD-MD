<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JAWAD-MD | STATUS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050505;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 500px;
      padding: 40px 25px;
      text-align: center;
      border: 1px solid #00ffcc;
      border-radius: 20px;
      background: #0b0b0b;
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.25);
    }

    h1 {
      color: #00ffcc;
      margin-bottom: 15px;
    }

    .status {
      font-size: 20px;
      margin-bottom: 15px;
    }

    .success {
      color: #00ff88;
      font-weight: bold;
    }

    .info {
      color: #ccc;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .links a {
      display: inline-block;
      margin: 8px;
      color: #00ffcc;
      text-decoration: none;
      font-size: 15px;
    }

    .links a:hover {
      color: #fff;
    }

    footer {
      margin-top: 25px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1><i class="fas fa-robot"></i> JAWAD-MD</h1>

    <div class="status">
      <span class="success">● Connected</span>
    </div>

    <p class="info">
      Deployment Successful! Your bot is live.
    </p>

    <div class="links">
      <a href="https://github.com/JawadTechXD/JAWAD-MD" target="_blank">
        <i class="fab fa-github"></i> GitHub
      </a>

      <a href="https://youtube.com/" target="_blank">
        <i class="fab fa-youtube"></i> YouTube
      </a>

      <a href="https://whatsapp.com/channel/" target="_blank">
        <i class="fab fa-whatsapp"></i> WhatsApp
      </a>
    </div>

    <footer>
      Developed by JawadTechX
    </footer>
  </div>
</body>
</html>
